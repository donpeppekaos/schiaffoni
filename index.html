<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schiaffoni</title>
<meta name="description" content="Schiaffoni. Apertura in arrivo.">
<link rel="icon" type="image/png" href="assets/icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --green: #1d5634;
    --green-soft: #2f5d43;
    --paper: #faf9f6;
    --line: #dcd7cc;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--green);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Banner / nav ---------- */

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.4rem clamp(1.25rem, 4vw, 3rem);
    border-bottom: 1px solid var(--line);
  }

  header img {
    height: clamp(28px, 4vw, 38px);
    width: auto;
    display: block;
  }

  nav {
    display: flex;
    gap: clamp(1rem, 3vw, 2.4rem);
  }

  nav a {
    color: var(--green-soft);
    text-decoration: none;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: color 0.2s ease;
    white-space: nowrap;
  }

  nav a:hover, nav a:focus-visible {
    color: var(--green);
  }

  .nav-toggle {
    display: none;
    background: none;
    border: 1px solid var(--line);
    color: var(--green);
    width: 38px;
    height: 38px;
    border-radius: 2px;
    font-size: 1rem;
  }

  @media (max-width: 680px) {
    nav {
      position: fixed;
      inset: 68px 0 0 0;
      background: var(--paper);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.8rem;
      transform: translateY(-8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    nav.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    nav a { font-size: 0.85rem; }
    .nav-toggle { display: block; }
  }

  /* ---------- Hero / centro pagina ---------- */

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    text-align: center;
  }

  .stage { max-width: 90vw; }

  .logo {
    width: clamp(220px, 40vw, 480px);
    height: auto;
    display: block;
    margin: 0 auto;
    opacity: 0;
    transform: translateY(14px);
  }

  .tagline {
    margin-top: 2.1rem;
    font-size: 0.78rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--green-soft);
    opacity: 0;
    transform: translateY(10px);
  }

  .tagline::before,
  .tagline::after {
    content: '—';
    margin: 0 0.8em;
    opacity: 0.5;
  }

  .location {
    margin-top: 1.1rem;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--green-soft);
    opacity: 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .logo {
      animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }
    .tagline {
      animation: rise 0.9s ease 0.55s forwards;
    }
    .location {
      animation: fade 0.9s ease 0.8s forwards;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .tagline, .location { opacity: 1; transform: none; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fade {
    from { opacity: 0; }
    to { opacity: 0.7; }
  }
</style>
</head>
<body>

  <header>
    <a href="index.html"><img src="assets/icon.png" alt="Schiaffoni"></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav" onclick="const n=document.getElementById('main-nav'); const open=n.classList.toggle('open'); this.setAttribute('aria-expanded', open);">☰</button>
    <nav id="main-nav">
      <a href="index.html">Home</a>
      <a href="index.html">La nostra storia</a>
      <a href="index.html">Menu</a>
      <a href="index.html">Gift Card</a>
      <a href="index.html">Contatti</a>
      <a href="index.html">Prenota</a>
    </nav>
  </header>

  <main>
    <div class="stage">
      <img class="logo" src="assets/logo.png" alt="Schiaffoni">
      <p class="tagline">NEXT OPENING</p>
      <p class="location">VIA MANZONI, NAPOLI</p>
    </div>
  </main>

</body>
</html>
