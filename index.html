<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schiaffoni — Next Opening</title>
<meta name="description" content="Schiaffoni, Roma. Apertura in arrivo.">
<link rel="icon" type="image/png" href="assets/icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --green: #1d5634;
    --green-soft: #2f5d43;
    --paper: #faf9f6;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--paper);
    color: var(--green);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    overflow: hidden;
    position: relative;
  }

  @media (prefers-reduced-motion: no-preference) {
    .fade-in {
      animation: fadeIn 1.1s ease both;
    }
    .fade-in.delay {
      animation-delay: 0.25s;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stage {
    text-align: center;
    max-width: 90vw;
  }

  .icon {
    width: clamp(64px, 12vw, 110px);
    height: auto;
    margin: 0 auto 2rem;
    display: block;
  }

  .logo {
    width: clamp(240px, 42vw, 520px);
    height: auto;
    display: block;
    margin: 0 auto;
  }

  .tagline {
    margin-top: 2.25rem;
    font-size: 0.78rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--green-soft);
  }

  .tagline::before,
  .tagline::after {
    content: '—';
    margin: 0 0.8em;
    opacity: 0.5;
  }

  .location {
    margin-top: 1.1rem;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--green-soft);
    opacity: 0.7;
  }
</style>
</head>
<body>

  <div class="stage">
    <img class="icon fade-in" src="assets/icon.png" alt="">
    <img class="logo fade-in delay" src="assets/logo.png" alt="Schiaffoni">
    <p class="tagline fade-in delay">Next Opening</p>
    <p class="location fade-in delay">Roma</p>
  </div>

</body>
</html>
